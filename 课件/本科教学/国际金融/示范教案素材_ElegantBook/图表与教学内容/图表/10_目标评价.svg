<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">教学目标与评价证据相互对应</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">评价专业判断的过程与结果，不以口号数量代替学习成效</text><rect x="30" y="122" width="330" height="164" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><text x="53" y="167" font-size="25" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">知识目标</text><text x="53" y="211" font-size="18" fill="#287d78" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">分类与净额计算</text><text x="53" y="251" font-size="16" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">诊断题 · 课堂计算表</text><rect x="390" y="122" width="330" height="164" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><text x="413" y="167" font-size="25" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">能力目标</text><text x="413" y="211" font-size="18" fill="#287d78" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">证据核验与方案比较</text><text x="413" y="251" font-size="16" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">AI核验单 · 决策单</text><rect x="750" y="122" width="330" height="164" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><text x="773" y="167" font-size="25" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">素养目标</text><text x="773" y="211" font-size="18" fill="#287d78" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">诚信履约与风险责任</text><text x="773" y="251" font-size="16" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">前提说明 · 边界与复核</text><text x="550" y="342" font-size="18" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">个人学习70% + 小组决策30%；本讲评价不擅自改变整门课程总评权重。</text></svg>