<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430"><rect width="1100" height="430" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">远期结汇匹配美元净应收</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">卖出美元、买入人民币；币种、金额和交割日与业务相匹配</text><rect x="40" y="136" width="260" height="160" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><text x="170" y="181" font-size="28" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">实体企业</text><text x="170" y="220" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">到期净应收40万美元</text><text x="170" y="252" font-size="18" fill="#287d78" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">美元多头</text><rect x="800" y="136" width="260" height="160" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><text x="930" y="181" font-size="28" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">交易银行</text><text x="930" y="220" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">按约定汇率交割</text><text x="930" y="252" font-size="18" fill="#287d78" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">F = 7.10元/美元</text><line x1="330" y1="180" x2="770" y2="180" stroke="#1c3b61" stroke-width="3"/><path d="M761 175 L770 180 L761 185" fill="none" stroke="#1c3b61" stroke-width="3"/><text x="550" y="158" font-size="20" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">到期交付40万美元</text><line x1="770" y1="254" x2="330" y2="254" stroke="#287d78" stroke-width="3"/><path d="M321 249 L330 254 L321 259" fill="none" stroke="#287d78" stroke-width="3"/><text x="550" y="289" font-size="20" fill="#287d78" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">到期取得284万元人民币</text><text x="550" y="373" font-size="18" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">锁定的是本笔净敞口的折算金额；企业利润与其他风险仍需另行分析。</text></svg>