<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420"><rect width="1100" height="420" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">先匹配现金流，再识别净敞口</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">自然匹配成立须核对主体、币种、日期与确定性</text><text x="30" y="155" font-size="19" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">应收美元</text><rect x="210" y="125" width="680.0" height="47" rx="5" fill="#1c3b61" stroke="#1c3b61"/><text x="910.0" y="157" font-size="24" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">100万美元</text><text x="30" y="237" font-size="19" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">可匹配应付</text><rect x="210" y="207" width="408.0" height="47" rx="5" fill="#287d78" stroke="#287d78"/><text x="638.0" y="239" font-size="24" fill="#287d78" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">60万美元</text><text x="30" y="319" font-size="19" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">剩余净应收</text><rect x="210" y="289" width="272.0" height="47" rx="5" fill="#b68d45" stroke="#b68d45"/><text x="502.0" y="321" font-size="24" fill="#b68d45" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">40万美元</text><text x="550" y="395" font-size="23" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">100 − 60 = 40万美元；远期比例以40为基数。</text></svg>