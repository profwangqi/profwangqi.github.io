<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 1100 190" width="1100" height="190"><rect width="1100" height="390" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">把AI建议变成可以审查的证据链</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">预置文本用于核验练习，不冒充实时AI调用记录</text><text x="40" y="143" font-size="42" fill="#b68d45" text-anchor="start" font-weight="400" font-family="Georgia,serif">01</text><text x="40" y="187" font-size="24" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">独立判断</text><text x="40" y="233" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">先识别净敞口</text><text x="40" y="264" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">写出交易方向</text><line x1="230" y1="182" x2="280" y2="182" stroke="#287d78" stroke-width="2"/><path d="M271 177 L280 182 L271 187" fill="none" stroke="#287d78" stroke-width="2"/><text x="313" y="143" font-size="42" fill="#b68d45" text-anchor="start" font-weight="400" font-family="Georgia,serif">02</text><text x="313" y="187" font-size="24" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">获取建议</text><text x="313" y="233" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">使用标准提示词</text><text x="313" y="264" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">要求步骤与边界</text><line x1="503" y1="182" x2="553" y2="182" stroke="#287d78" stroke-width="2"/><path d="M544 177 L553 182 L544 187" fill="none" stroke="#287d78" stroke-width="2"/><text x="586" y="143" font-size="42" fill="#b68d45" text-anchor="start" font-weight="400" font-family="Georgia,serif">03</text><text x="586" y="187" font-size="24" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">逐项核验</text><text x="586" y="233" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">核单位、核方向</text><text x="586" y="264" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">代入情景独立复算</text><line x1="776" y1="182" x2="826" y2="182" stroke="#287d78" stroke-width="2"/><path d="M817 177 L826 182 L817 187" fill="none" stroke="#287d78" stroke-width="2"/><text x="859" y="143" font-size="42" fill="#b68d45" text-anchor="start" font-weight="400" font-family="Georgia,serif">04</text><text x="859" y="187" font-size="24" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">修正并负责</text><text x="859" y="233" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">记录错误与依据</text><text x="859" y="264" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">签署小组决策结论</text><text x="550" y="346" font-size="19" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">计算工具提供结果，AI提供待核建议，最终判断由学生与教师完成。</text></svg>