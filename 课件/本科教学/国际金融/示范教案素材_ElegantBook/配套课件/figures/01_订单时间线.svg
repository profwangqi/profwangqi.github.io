<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430"><rect width="1100" height="430" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">一笔订单的三个时点</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">课堂案例设定 · 同一企业、同币种、同到期日 · 金额单位：万美元</text><line x1="90" y1="205" x2="1010" y2="205" stroke="#1c3b61" stroke-width="2"/><circle cx="140" cy="205" r="9" fill="#b68d45"/><text x="140" y="142" font-size="44" fill="#b68d45" text-anchor="middle" font-weight="400" font-family="Georgia,serif">01</text><text x="140" y="183" font-size="20" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">现在</text><text x="140" y="250" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">订单与合同确认</text><text x="140" y="280" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">核对金额、币种和日期</text><circle cx="550" cy="205" r="9" fill="#b68d45"/><text x="550" y="142" font-size="44" fill="#b68d45" text-anchor="middle" font-weight="400" font-family="Georgia,serif">02</text><text x="550" y="183" font-size="20" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">办理管理安排</text><text x="550" y="250" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">先自然匹配</text><text x="550" y="280" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">对剩余敞口确定远期比例</text><circle cx="960" cy="205" r="9" fill="#b68d45"/><text x="960" y="142" font-size="44" fill="#b68d45" text-anchor="middle" font-weight="400" font-family="Georgia,serif">03</text><text x="960" y="183" font-size="20" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">三个月后</text><text x="960" y="250" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">收款100 · 付款60</text><text x="960" y="280" font-size="17" fill="#6b7d8e" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">净应收40万美元</text><text x="550" y="367" font-size="19" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">汇率变化影响人民币折算收入，不自动改变合同规定的美元金额。</text></svg>