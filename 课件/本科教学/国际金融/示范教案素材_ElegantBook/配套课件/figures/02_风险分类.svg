<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430"><rect width="1100" height="430" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">三类风险分清观察对象</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">本讲重点：已确定、尚未结算的外币收付款；其他两类用于建立边界</text><rect x="30" y="106" width="330" height="267" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><rect x="30" y="106" width="330" height="6" rx="0" fill="#287d78" stroke="#287d78"/><text x="53" y="153" font-size="26" fill="#287d78" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">交易风险</text><text x="53" y="190" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">确定外币收付款</text><text x="53" y="243" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">对象：应收、应付或合同承诺</text><text x="53" y="278" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">结果：结算时本币金额变化</text><text x="53" y="313" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">本例：三个月后的美元净应收</text><rect x="385" y="106" width="330" height="267" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><rect x="385" y="106" width="330" height="6" rx="0" fill="#1c3b61" stroke="#1c3b61"/><text x="408" y="153" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">折算风险</text><text x="408" y="190" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">外币报表转换</text><text x="408" y="243" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">对象：境外经营财务报表</text><text x="408" y="278" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">结果：报表项目折算变化</text><text x="408" y="313" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">不能直接等同本期现金损失</text><rect x="740" y="106" width="330" height="267" rx="10" fill="#f2f5f8" stroke="#dce3e9"/><rect x="740" y="106" width="330" height="6" rx="0" fill="#b68d45" stroke="#b68d45"/><text x="763" y="153" font-size="26" fill="#b68d45" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">经济风险</text><text x="763" y="190" font-size="17" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">未来竞争与现金流</text><text x="763" y="243" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">对象：未来经营收入与成本</text><text x="763" y="278" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">结果：价格、销量与竞争力变化</text><text x="763" y="313" font-size="16" fill="#1c3b61" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">不局限于一笔已签合同</text></svg>