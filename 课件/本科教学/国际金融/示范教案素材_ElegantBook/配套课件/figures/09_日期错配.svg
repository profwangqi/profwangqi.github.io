<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380"><rect width="1100" height="380" fill="white"/><text x="30" y="38" font-size="26" fill="#1c3b61" text-anchor="start" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">日期不一致时，不能直接照搬40万美元</text><text x="30" y="70" font-size="15" fill="#6b7d8e" text-anchor="start" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">反例：应付提前一个月，收款日仍为三个月后；需要分析资金衔接</text><line x1="100" y1="196" x2="1000" y2="196" stroke="#1c3b61" stroke-width="2"/><circle cx="140" cy="196" r="8" fill="#1c3b61"/><text x="140" y="151" font-size="22" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">现在</text><text x="140" y="243" font-size="19" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">合同确认</text><circle cx="540" cy="196" r="8" fill="#a65457"/><text x="540" y="151" font-size="22" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">两个月后</text><text x="540" y="243" font-size="19" fill="#a65457" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">先付60万美元</text><circle cx="950" cy="196" r="8" fill="#287d78"/><text x="950" y="151" font-size="22" fill="#1c3b61" text-anchor="middle" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">三个月后</text><text x="950" y="243" font-size="19" fill="#287d78" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">后收100万美元</text><text x="550" y="330" font-size="20" fill="#1c3b61" text-anchor="middle" font-weight="400" font-family="PingFang SC,Microsoft YaHei,sans-serif">重新分桶 → 分析融资与交割安排 → 再决定工具、金额和期限。</text></svg>